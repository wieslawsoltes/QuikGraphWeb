name: Blazor
on:
  pull_request:
  push:
    branches: [main]
    paths: ['blazor/**', 'src/**', 'dist/**', 'package*.json', '.gitmodules', '.github/workflows/blazor.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-in Blazor version from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  blazor:
    permissions:
      contents: write
    uses: wieslawsoltes/Dockyard/.github/workflows/blazor.yml@9a894d7c647a180669853660fd2acec24eb2885a
    with:
      project: blazor/src/QuikGraphWeb.Blazor.csproj
      package_name: QuikGraphWeb
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    secrets: inherit
